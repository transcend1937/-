<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客统计看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(135deg,#0a1628,#1a2a4a,#0d1b3e);
    min-height:100vh;color:#e2e8f0;padding:30px 20px
}
.container{max-width:900px;margin:0 auto}
h1{font-size:24px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.sub{color:#64748b;font-size:13px;margin-bottom:24px}
.back{display:inline-block;color:#60a5fa;text-decoration:none;font-size:14px;margin-bottom:20px}
.back:hover{text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.stat-card{
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;padding:16px;text-align:center
}
.stat-card .num{font-size:32px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-card .label{font-size:12px;color:#64748b;margin-top:4px}

h2{font-size:16px;color:#94a3b8;margin:20px 0 12px}
.chart{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:16px}
.bar-row{display:flex;align-items:center;margin-bottom:6px;font-size:13px}
.bar-label{width:80px;color:#94a3b8;flex-shrink:0}
.bar-track{flex:1;height:20px;background:rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;margin:0 8px}
.bar-fill{height:100%;border-radius:10px;transition:width 0.8s}
.bar-val{width:50px;text-align:right;color:#e2e8f0;font-size:12px}
.page-link{color:#60a5fa;text-decoration:none}
.page-link:hover{text-decoration:underline}

.logs{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;max-height:400px;overflow-y:auto;font-size:12px}
.log-item{display:flex;justify-content:space-between;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.04)}
.log-item:last-child{border:none}
.log-time{color:#64748b;width:80px;flex-shrink:0}
.log-page{color:#e2e8f0;flex:1;margin:0 8px}
.log-ref{color:#475569;width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.controls{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.controls button{
    padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.04);color:#94a3b8;cursor:pointer;font-size:13px;transition:all 0.2s
}
.controls button:hover,.controls button.active{border-color:#60a5fa;color:#60a5fa;background:rgba(96,165,250,0.1)}
</style>
</head>
<body>
<div class="container">
    <a class="back" href="/">← 返回首页</a>
    <h1>📈 访客统计看板</h1>
    <p class="sub">查看网站访问数据，了解哪些页面最受欢迎</p>

    <div class="controls" id="controls">
        <button onclick="loadStats(1)" class="active">近1天</button>
        <button onclick="loadStats(3)">近3天</button>
        <button onclick="loadStats(7)">近7天</button>
        <button onclick="loadStats(30)">近30天</button>
    </div>

    <div class="grid" id="statGrid">
        <div class="stat-card"><div class="num" id="totalVisits">-</div><div class="label">访问量</div></div>
        <div class="stat-card"><div class="num" id="totalPages">-</div><div class="label">页面数</div></div>
        <div class="stat-card"><div class="num" id="avgDaily">-</div><div class="label">日均访问</div></div>
    </div>

    <h2>📊 每日访问趋势</h2>
    <div class="chart" id="dailyChart"></div>

    <h2>🌐 页面排行</h2>
    <div class="chart" id="pageChart"></div>

    <h2>🕐 时段分布</h2>
    <div class="chart" id="hourlyChart"></div>

    <h2>📋 最近访问</h2>
    <div class="logs" id="recentLogs"></div>
</div>

<script>
async function loadStats(days){
    document.querySelectorAll('#controls button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    
    const res=await fetch(`/api/analytics?days=${days}`);
    const data=await res.json();
    
    document.getElementById('totalVisits').textContent=data.total;
    document.getElementById('totalPages').textContent=Object.keys(data.pages).length;
    document.getElementById('avgDaily').textContent=Math.round(data.total/(data.days||1));
    
    // Daily chart
    const dc=document.getElementById('dailyChart');
    let maxV=Math.max(...Object.values(data.daily),1);
    dc.innerHTML=Object.entries(data.daily).map(([k,v])=>{
        const pct=(v/maxV*100).toFixed(0);
        return `<div class="bar-row"><span class="bar-label">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#60a5fa,#a78bfa)"></div></div><span class="bar-val">${v}</span></div>`;
    }).join('');
    
    // Page chart
    const pc=document.getElementById('pageChart');
    maxV=Math.max(...Object.values(data.pages),1);
    pc.innerHTML=Object.entries(data.pages).map(([k,v])=>{
        const pct=(v/maxV*100).toFixed(0);
        const name=k.split('/').pop()||'/';
        return `<div class="bar-row"><span class="bar-label"><a class="page-link" href="${k}" target="_blank">${name}</a></span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#34d399,#60a5fa)"></div></div><span class="bar-val">${v}</span></div>`;
    }).join('');
    
    // Hourly chart
    const hc=document.getElementById('hourlyChart');
    maxV=Math.max(...Object.values(data.hourly),1);
    hc.innerHTML=Object.entries(data.hourly).map(([k,v])=>{
        const pct=(v/maxV*100).toFixed(0);
        return `<div class="bar-row"><span class="bar-label">${k}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,#f59e0b,#ef4444)"></div></div><span class="bar-val">${v}</span></div>`;
    }).join('');
    
    // Recent logs
    const rl=document.getElementById('recentLogs');
    rl.innerHTML=data.latest.map(r=>{
        const time=new Date(r.t*1000);
        const timeStr=time.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        const ua=r.ua||'';
        const device=ua.includes('Mobile')?'📱':(ua.includes('iPhone')?'📱':(ua.includes('Android')?'📱':'💻'));
        return `<div class="log-item"><span class="log-time">${timeStr}</span><span class="log-page">${device} ${r.p}</span><span class="log-ref" title="${r.r}">${r.r||'-'}</span></div>`;
    }).join('');
}

loadStats(1);
</script>
</body>
</html>
